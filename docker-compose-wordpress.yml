version: '3.8'
services:
  wordpress:
    image: wordpress:latest
    container_name: wordpress
    ports:
      - "8000:80"
    environment:
      WORDPRESS_DB_HOST: wordpress-db
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: wpwachtwoord123
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wordpress-data:/var/www/html
    depends_on:
      - wordpress-db

  wordpress-db:
    image: mysql:8.0
    container_name: wordpress-db
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: wpwachtwoord123
      MYSQL_ROOT_PASSWORD: rootwachtwoord123
    volumes:
      - wordpress-db-data:/var/lib/mysql

volumes:
  wordpress-data:
  wordpress-db-data:
